# GCP Cloud Build — Kindy 컨테이너 이미지 빌드.
#
# 사용:
#   gcloud builds submit \
#     --config=cloudbuild.yaml \
#     --substitutions=_SUPABASE_URL=https://xxx.supabase.co,_SUPABASE_ANON_KEY=eyJ...,_TAG=latest
#
# 결과: gcr.io/$PROJECT_ID/kindy:$_TAG 이미지가 Google Container Registry 에 push 됨.
#
# 주의: _SUPABASE_ANON_KEY 는 public key 이므로 클라이언트 번들에 박혀도 안전.
#       service_role / API 키 류는 여기 build-arg 로 절대 넘기지 말 것 (run time Secret Manager).

substitutions:
  _TAG: latest
  _SUPABASE_URL: ""
  _SUPABASE_ANON_KEY: ""
  # Inngest signing/event keys are runtime Secret Manager values, not build args.

steps:
  # 빌드 (Supabase URL/ANON_KEY 를 client bundle 에 박음)
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=gcr.io/$PROJECT_ID/kindy:$_TAG
      - --build-arg=NEXT_PUBLIC_SUPABASE_URL=$_SUPABASE_URL
      - --build-arg=NEXT_PUBLIC_SUPABASE_ANON_KEY=$_SUPABASE_ANON_KEY
      - .

images:
  - gcr.io/$PROJECT_ID/kindy:$_TAG

# Cloud Build VM 크기 — Next.js 빌드는 메모리 꽤 씀. 기본(e2-standard-2, 8GB) 로 충분.
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

# Next.js 빌드 + node_modules 설치 고려해서 20분 허용.
timeout: 1200s
