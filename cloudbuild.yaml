# Kindy production image build.
#
# This file only builds and publishes an immutable Artifact Registry image.
# Cloud Run deployment is deliberately handled by scripts/gcp-release.sh so the
# exact same digest is verified in preview before production promotion.
#
# Run through:
#   bash scripts/gcp-release.sh build
#
# NEXT_PUBLIC_* values are public by definition, but they are still validated
# here because an empty value is permanently inlined into the Next.js bundle.
# Runtime credentials must never be passed as substitutions or Docker args.

substitutions:
  _EXPECTED_PROJECT: kindy-493701
  _REGION: asia-northeast3
  _ARTIFACT_REPOSITORY: kindy-containers
  _IMAGE_NAME: kindy-web
  _IMAGE_TAG: ""
  _SOURCE_SHA: ""
  _PAYMENTS_ENABLED: "0"
  _SUPABASE_URL: ""
  _SUPABASE_ANON_KEY: ""
  _TOSS_CLIENT_KEY: ""
  _PORTONE_STORE_ID: ""
  _PORTONE_CHANNEL_KEY: ""
  _SITE_URL: ""
  _BIZ_REPRESENTATIVE_NAME: ""
  _BIZ_REGISTRATION_NUMBER: ""
  _BIZ_MAIL_ORDER_NUMBER: ""
  _BIZ_ADDRESS: ""
  _BIZ_PHONE: ""
  _BIZ_EMAIL: ""
  _KINDY_START_BASE: ""

steps:
  - id: validate-release-inputs
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    env:
      - "BUILD_PROJECT=$PROJECT_ID"
      - "EXPECTED_PROJECT=${_EXPECTED_PROJECT}"
      - "IMAGE_TAG=${_IMAGE_TAG}"
      - "SOURCE_SHA=${_SOURCE_SHA}"
      - "PAYMENTS_ENABLED=${_PAYMENTS_ENABLED}"
      - "SUPABASE_URL=${_SUPABASE_URL}"
      - "SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}"
      - "TOSS_CLIENT_KEY=${_TOSS_CLIENT_KEY}"
      - "PORTONE_STORE_ID=${_PORTONE_STORE_ID}"
      - "PORTONE_CHANNEL_KEY=${_PORTONE_CHANNEL_KEY}"
      - "SITE_URL=${_SITE_URL}"
      - "BIZ_REPRESENTATIVE_NAME=${_BIZ_REPRESENTATIVE_NAME}"
      - "BIZ_REGISTRATION_NUMBER=${_BIZ_REGISTRATION_NUMBER}"
      - "BIZ_MAIL_ORDER_NUMBER=${_BIZ_MAIL_ORDER_NUMBER}"
      - "BIZ_ADDRESS=${_BIZ_ADDRESS}"
      - "BIZ_PHONE=${_BIZ_PHONE}"
      - "BIZ_EMAIL=${_BIZ_EMAIL}"
    args:
      - -ceu
      - |
        fail() {
          echo "ERROR: $$1" >&2
          exit 2
        }
        require_nonempty() {
          name="$$1"
          value="$$(printenv "$$name")"
          [ -n "$$value" ] || fail "$$name is required"
        }

        [ "$$BUILD_PROJECT" = "$$EXPECTED_PROJECT" ] || \
          fail "build project must be $$EXPECTED_PROJECT (got $$BUILD_PROJECT)"

        require_nonempty SOURCE_SHA
        case "$$SOURCE_SHA" in
          *[!0-9a-f]*) fail "SOURCE_SHA must be a lowercase 40-character git SHA" ;;
        esac
        [ "$${#SOURCE_SHA}" -eq 40 ] || \
          fail "SOURCE_SHA must be a lowercase 40-character git SHA"
        case "$$PAYMENTS_ENABLED" in
          0|1) ;;
          *) fail "PAYMENTS_ENABLED must be 0 or 1" ;;
        esac
        [ "$$IMAGE_TAG" = "git-$$SOURCE_SHA-pay$$PAYMENTS_ENABLED" ] || \
          fail "IMAGE_TAG must exactly equal git-$$SOURCE_SHA-pay$$PAYMENTS_ENABLED"

        for required in SUPABASE_URL SUPABASE_ANON_KEY SITE_URL
        do
          require_nonempty "$$required"
        done

        if [ "$$PAYMENTS_ENABLED" = "1" ]; then
          for required in \
            PORTONE_STORE_ID PORTONE_CHANNEL_KEY BIZ_REPRESENTATIVE_NAME \
            BIZ_REGISTRATION_NUMBER BIZ_MAIL_ORDER_NUMBER BIZ_ADDRESS \
            BIZ_PHONE BIZ_EMAIL
          do
            require_nonempty "$$required"
          done
        else
          for disabled in \
            TOSS_CLIENT_KEY PORTONE_STORE_ID PORTONE_CHANNEL_KEY \
            BIZ_REPRESENTATIVE_NAME BIZ_REGISTRATION_NUMBER \
            BIZ_MAIL_ORDER_NUMBER BIZ_ADDRESS BIZ_PHONE BIZ_EMAIL
          do
            value="$$(printenv "$$disabled")"
            [ -z "$$value" ] || \
              fail "$$disabled must be empty when PAYMENTS_ENABLED=0"
          done
        fi

        case "$$SUPABASE_URL" in
          https://*.supabase.co) ;;
          *) fail "SUPABASE_URL must be an https://*.supabase.co URL" ;;
        esac
        case "$$SITE_URL" in
          https://*) ;;
          *) fail "SITE_URL must use https://" ;;
        esac
        if [ "$$PAYMENTS_ENABLED" = "1" ] && [ "$$SITE_URL" != "https://kindy.kr" ]; then
          fail "payment-enabled releases must use SITE_URL=https://kindy.kr"
        fi
        if [ "$$PAYMENTS_ENABLED" = "1" ]; then
          case "$$BIZ_EMAIL" in
            *@*.*) ;;
            *) fail "BIZ_EMAIL must look like an email address" ;;
          esac
        fi

        echo "Validated immutable release git-$$SOURCE_SHA-pay$$PAYMENTS_ENABLED for $$BUILD_PROJECT."

  - id: build-image
    name: gcr.io/cloud-builders/docker
    waitFor:
      - validate-release-inputs
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}
      - --label=org.opencontainers.image.revision=${_SOURCE_SHA}
      - --label=org.opencontainers.image.source=https://github.com/GenTA-AI/kindy-web-v2
      - --label=kr.kindy.payments-enabled=${_PAYMENTS_ENABLED}
      - --build-arg=NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg=NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}
      - --build-arg=NEXT_PUBLIC_TOSS_CLIENT_KEY=${_TOSS_CLIENT_KEY}
      - --build-arg=NEXT_PUBLIC_PORTONE_STORE_ID=${_PORTONE_STORE_ID}
      - --build-arg=NEXT_PUBLIC_PORTONE_CHANNEL_KEY=${_PORTONE_CHANNEL_KEY}
      - --build-arg=NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --build-arg=NEXT_PUBLIC_BIZ_REPRESENTATIVE_NAME=${_BIZ_REPRESENTATIVE_NAME}
      - --build-arg=NEXT_PUBLIC_BIZ_REGISTRATION_NUMBER=${_BIZ_REGISTRATION_NUMBER}
      - --build-arg=NEXT_PUBLIC_BIZ_MAIL_ORDER_NUMBER=${_BIZ_MAIL_ORDER_NUMBER}
      - --build-arg=NEXT_PUBLIC_BIZ_ADDRESS=${_BIZ_ADDRESS}
      - --build-arg=NEXT_PUBLIC_BIZ_PHONE=${_BIZ_PHONE}
      - --build-arg=NEXT_PUBLIC_BIZ_EMAIL=${_BIZ_EMAIL}
      - --build-arg=NEXT_PUBLIC_KINDY_START_BASE=${_KINDY_START_BASE}
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
